<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #00ffcc;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #00ffcc;
            color: #000;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #00ccaa;
        }
    </style>
</head>
<body>

    <h1>Welcome Bro 🚀</h1>
    <p>This is your basic HTML page</p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            alert("HTML + JS working perfectly 🔥");
        }
    </script>

</body>
</html>
